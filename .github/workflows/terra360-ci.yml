```yaml
name: Terra360 - Verificação protegida

on:
  push:
    branches:
      - automation/terra360-protected-ci
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar compilação
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Compilar o Terra360
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
```
